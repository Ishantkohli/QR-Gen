<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Verification • QR Studio Pro</title>
  <meta name="description" content="QR Code validity verification and smart redirect.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .expire-page-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: var(--bg-main);
      background-image:
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
    }

    .expire-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .expire-icon-bubble {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 1.25rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .icon-active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 2px solid rgba(16, 185, 129, 0.3);
      animation: pulseGlow 2s infinite;
    }

    .icon-expired {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 2px solid rgba(244, 63, 94, 0.3);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 20px 4px rgba(16, 185, 129, 0.2); }
    }

    .expire-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      margin-bottom: 0.85rem;
    }

    .badge-active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-expired {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .expire-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }

    .expire-desc {
      font-size: 0.925rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.55;
    }

    .info-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.9rem 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .info-val {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
      margin: 1.25rem 0 0.5rem 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary-gradient);
      width: 0%;
      transition: width 1s linear;
    }

    .expire-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .expire-footer-note {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
  </style>
</head>

<body class="expire-page-body">

  <div class="expire-card" id="mainCard">
    <!-- Icon -->
    <div class="expire-icon-bubble" id="statusIcon">
      <i data-lucide="loader-2" class="spin-icon"></i>
    </div>

    <!-- Status Badge -->
    <div id="statusBadge" class="expire-badge badge-active">
      <i data-lucide="clock" style="width: 12px; height: 12px;"></i>
      <span id="badgeText">Verifying Pass...</span>
    </div>

    <!-- Title -->
    <h1 class="expire-title" id="statusTitle">Checking Expiration Date</h1>
    <p class="expire-desc" id="statusDesc">Please wait while we verify the security validity of this QR code.</p>

    <!-- Meta Details Box -->
    <div class="info-box" id="infoBox" style="display: none;">
      <div class="info-row" id="expiryDateRow">
        <span class="info-label">Expiration Date</span>
        <span class="info-val" id="valExpiryDate">--</span>
      </div>
      <div class="info-row" id="timeRemainingRow">
        <span class="info-label">Time Status</span>
        <span class="info-val" id="valTimeRemaining">--</span>
      </div>
      <div class="info-row" id="targetHostRow">
        <span class="info-label">Destination</span>
        <span class="info-val" id="valTargetHost">--</span>
      </div>
    </div>

    <!-- Progress Bar (for active redirects) -->
    <div id="progressTrack" class="progress-track" style="display: none;">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>

    <!-- Action Buttons -->
    <div class="expire-actions" id="actionButtons">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Footer Note -->
    <div class="expire-footer-note">
      <i data-lucide="shield-check" style="width: 14px; height: 14px; color: var(--accent-emerald);"></i>
      <span>Secured with QR Studio Pro Time-Lock Technology</span>
    </div>
  </div>

  <script>
    (function () {
      // Initialize Lucide icons
      if (window.lucide) lucide.createIcons();

      // Theme initialization
      const savedTheme = localStorage.getItem('qr_studio_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // Parse Query Parameters
      const urlParams = new URLSearchParams(window.location.search);
      let targetUrl = urlParams.get('target') || '';
      const expParam = urlParams.get('exp') || '';
      const customMsg = urlParams.get('msg') || '';
      const fallbackUrl = urlParams.get('fallback') || '';
      const customTitle = urlParams.get('title') || '';

      // Decode base64 target if encoded
      if (targetUrl.startsWith('b64:')) {
        try {
          targetUrl = decodeURIComponent(escape(atob(targetUrl.substring(4))));
        } catch (e) {
          targetUrl = targetUrl.substring(4);
        }
      }

      // Ensure proper protocol
      if (targetUrl && !/^https?:\/\//i.test(targetUrl) && !/^mailto:/i.test(targetUrl) && !/^tel:/i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }

      const statusIcon = document.getElementById('statusIcon');
      const statusBadge = document.getElementById('statusBadge');
      const badgeText = document.getElementById('badgeText');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const infoBox = document.getElementById('infoBox');
      const valExpiryDate = document.getElementById('valExpiryDate');
      const valTimeRemaining = document.getElementById('valTimeRemaining');
      const valTargetHost = document.getElementById('valTargetHost');
      const actionButtons = document.getElementById('actionButtons');
      const progressTrack = document.getElementById('progressTrack');
      const progressBarFill = document.getElementById('progressBarFill');

      if (!targetUrl && !expParam) {
        // No parameters passed (direct visit)
        statusIcon.className = 'expire-icon-bubble icon-active';
        statusIcon.innerHTML = '<i data-lucide="qr-code"></i>';
        statusBadge.className = 'expire-badge badge-active';
        badgeText.textContent = 'QR Studio Pro';
        statusTitle.textContent = 'Time-Locked QR Service';
        statusDesc.textContent = 'This page acts as a secure verification router for time-sensitive, expiring QR codes.';
        actionButtons.innerHTML = '<a href="index.html" class="btn-primary" style="text-decoration:none; justify-content:center;"><i data-lucide="plus-circle"></i> Create Your Own Expiring QR Code</a>';
        if (window.lucide) lucide.createIcons();
        return;
      }

      let expiryTimestamp = null;
      if (expParam) {
        const parsed = Number(expParam);
        if (!isNaN(parsed) && parsed > 0) {
          expiryTimestamp = parsed;
        } else {
          expiryTimestamp = new Date(expParam).getTime();
        }
      }

      const now = Date.now();
      const isExpired = expiryTimestamp ? (now >= expiryTimestamp) : false;

      infoBox.style.display = 'flex';

      if (targetUrl) {
        try {
          const u = new URL(targetUrl);
          valTargetHost.textContent = u.hostname + (u.pathname !== '/' ? u.pathname : '');
        } catch (e) {
          valTargetHost.textContent = targetUrl;
        }
      } else {
        document.getElementById('targetHostRow').style.display = 'none';
      }

      if (expiryTimestamp) {
        const expDate = new Date(expiryTimestamp);
        valExpiryDate.textContent = expDate.toLocaleString(undefined, {
          dateStyle: 'medium',
          timeStyle: 'short'
        });
      } else {
        document.getElementById('expiryDateRow').style.display = 'none';
        document.getElementById('timeRemainingRow').style.display = 'none';
      }

      if (isExpired) {
        // ==========================================
        // EXPIRED STATE
        // ==========================================
        statusIcon.className = 'expire-icon-bubble icon-expired';
        statusIcon.innerHTML = '<i data-lucide="clock-alert" style="width: 38px; height: 38px;"></i>';
        statusBadge.className = 'expire-badge badge-expired';
        badgeText.textContent = 'QR CODE EXPIRED';

        statusTitle.textContent = customTitle || 'This QR Code Has Expired';
        statusDesc.textContent = customMsg || 'The time limit set by the creator of this QR code has ended, and access is no longer active.';

        valTimeRemaining.textContent = 'Expired ' + getTimeAgo(expiryTimestamp);
        valTimeRemaining.style.color = 'var(--accent-rose)';

        let buttonsHtml = '';
        if (fallbackUrl) {
          let cleanFb = fallbackUrl.startsWith('http') ? fallbackUrl : 'https://' + fallbackUrl;
          buttonsHtml += `<a href="${cleanFb}" class="btn-primary" style="text-decoration:none; justify-content:center;"><i data-lucide="external-link"></i> Visit Alternative Resource</a>`;
        }

        buttonsHtml += `<a href="index.html" class="btn-secondary" style="text-decoration:none; justify-content:center;"><i data-lucide="arrow-left"></i> Create New QR Code</a>`;
        actionButtons.innerHTML = buttonsHtml;

      } else {
        // ==========================================
        // ACTIVE STATE (Not Expired)
        // ==========================================
        statusIcon.className = 'expire-icon-bubble icon-active';
        statusIcon.innerHTML = '<i data-lucide="check-circle" style="width: 38px; height: 38px;"></i>';
        statusBadge.className = 'expire-badge badge-active';
        badgeText.textContent = 'ACTIVE & VALID';

        statusTitle.textContent = customTitle || 'Redirecting You Now...';
        statusDesc.textContent = 'This QR pass is valid and active. Forwarding you to your destination.';

        if (expiryTimestamp) {
          valTimeRemaining.textContent = 'Valid for ' + getTimeRemaining(expiryTimestamp);
          valTimeRemaining.style.color = 'var(--accent-emerald)';
        }

        progressTrack.style.display = 'block';
        setTimeout(() => {
          progressBarFill.style.width = '100%';
        }, 50);

        actionButtons.innerHTML = `
          <a href="${targetUrl}" class="btn-primary" id="btnGoNow" style="text-decoration:none; justify-content:center;">
            <i data-lucide="arrow-right"></i> Open Link Now
          </a>
        `;

        // Automatically redirect after 1.2 seconds if target is present
        if (targetUrl) {
          setTimeout(() => {
            window.location.replace(targetUrl);
          }, 1200);
        }
      }

      if (window.lucide) lucide.createIcons();

      // Helpers
      function getTimeAgo(timestamp) {
        const diffMs = Date.now() - timestamp;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 60) return `${diffMins} min ago`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
        const diffDays = Math.floor(diffHours / 24);
        return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
      }

      function getTimeRemaining(timestamp) {
        const diffMs = timestamp - Date.now();
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 60) return `${diffMins} min remaining`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} remaining`;
        const diffDays = Math.floor(diffHours / 24);
        return `${diffDays} day${diffDays > 1 ? 's' : ''} remaining`;
      }

    })();
  </script>
</body>

</html>
